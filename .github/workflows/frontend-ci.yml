name: CollectFlow Frontend CI

on:
  push:
    branches:
      - feature/release-wp05-portable-cicd
      - "feature/**"
  pull_request:
    branches:
      - feature/release-wp05-portable-cicd
      - main

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-verification:
    name: Frontend CI & Security Gates
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js 22
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: "22"
          cache: "npm"

      - name: Deterministic Dependency Installation (npm ci)
        run: |
          npm ci

      - name: TypeScript Static Checking
        run: |
          npm run typecheck

      - name: ESLint Validation
        run: |
          npm run lint -- --format json -o /tmp/frontend-lint-report.json || npm run lint

      - name: Dependency Vulnerability Audit (npm audit)
        run: |
          npm audit --audit-level=high
          npm audit --json > /tmp/frontend-npm-audit.json 2>/dev/null || true

      - name: Secret Scanning Gate
        run: |
          python3 scripts/ci/scan_secrets.py --root . --json-output /tmp/frontend-secret-scan.json

      - name: Full Vitest Regression Suite
        run: |
          npm test -- --reporter=json --outputFile=/tmp/frontend-vitest-report.json
          python3 -c "
import json, sys
try:
    with open('/tmp/frontend-vitest-report.json') as f:
        data = json.load(f)
    if 'numPassedTests' not in data or 'numFailedTests' not in data:
        raise ValueError('Missing numPassedTests or numFailedTests in Vitest JSON report')
    num_passed = data['numPassedTests']
    num_failed = data['numFailedTests']
    num_total = data.get('numTotalTests', num_passed + num_failed)
    if num_passed <= 0:
        raise ValueError(f'Zero tests passed in Vitest suite (passed={num_passed}, total={num_total})')
    verdict = 'PASS' if num_failed == 0 else 'FAIL'
    with open('/tmp/frontend-test-summary.json', 'w') as out:
        json.dump({'passed': num_passed, 'failed': num_failed, 'total': num_total, 'verdict': verdict}, out, indent=2)
except Exception as e:
    print(f'ERROR: Failed to parse frontend Vitest report: {e}', file=sys.stderr)
    sys.exit(1)
"

      - name: Portable Mock Browser Acceptance (Playwright Mock)
        run: |
          echo "Installing Playwright Chromium browser and Linux system dependencies..."
          if ! npx playwright install --with-deps chromium; then
            echo "ERROR: Playwright Chromium browser and system dependencies installation failed (WP05-H02)"
            exit 1
          fi
          PW_VER=$(npx playwright --version)
          echo "Verified Playwright version: ${PW_VER}"
          npx playwright test e2e/stage2-responsive.spec.ts --config=playwright.mock.config.ts

      - name: Production SSR Build (Vite & Nitro)
        run: |
          npm run build

      - name: Install and Verify Pinned Trivy Scanner (Immutable Source & Checksum)
        env:
          TRIVY_VERSION: "0.58.2"
          EXPECTED_SHA256: "aa2c0ed6932ae70171b4f0f3fdb0403e29d9ce7e6fddad0ea08d440fdd695742"
        run: |
          TAR_PATH="/tmp/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "Downloading Trivy v${TRIVY_VERSION} from official immutable release..."
          curl -sfL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" -o "${TAR_PATH}"
          ACTUAL_SHA="$(sha256sum "${TAR_PATH}" | awk '{print $1}')"
          echo "Downloaded Tarball SHA-256: ${ACTUAL_SHA}"
          if [[ "${ACTUAL_SHA}" != "${EXPECTED_SHA256}" ]]; then
            echo "ERROR: Trivy tarball checksum verification failed! Expected ${EXPECTED_SHA256}, got ${ACTUAL_SHA}"
            exit 1
          fi
          sudo tar -xzf "${TAR_PATH}" -C /usr/local/bin trivy
          sudo chmod +x /usr/local/bin/trivy
          TRIVY_BIN=$(which trivy)
          TRIVY_VER=$(trivy --version | head -n 1)
          echo "Scanner binary:    ${TRIVY_BIN}"
          echo "Scanner version:   ${TRIVY_VER}"
          echo "Scanner checksum:  ${ACTUAL_SHA}"
          if [[ -z "${TRIVY_BIN}" || -z "${TRIVY_VER}" || "${TRIVY_VER}" != *"0.58.2"* ]]; then
            echo "ERROR: Pinned Trivy installation verification failed"
            exit 1
          fi

      - name: Build and Scan Frontend OCI Container Image
        run: |
          chmod +x scripts/ci/build_and_scan_image.sh
          ./scripts/ci/build_and_scan_image.sh frontend collectflow-frontend /tmp/frontend-image-meta.json no-publish /tmp/frontend-trivy-report.json


      - name: Generate CycloneDX SBOM
        run: |
          python3 scripts/ci/generate_sbom.py --repo-type frontend --root . --output /tmp/collectflow-frontend-sbom.json

      - name: Verify Cross-Repository Pairing Traceability
        run: |
          python3 scripts/ci/verify_cross_repo_release.py --initiator frontend --backend-path ../collectflow --frontend-path . --report /tmp/cross-repo-integration-report.json

      - name: Upload Build & Verification Evidence Artifacts
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        if: always()
        with:
          name: frontend-release-evidence
          path: |
            /tmp/frontend-image-meta.json
            /tmp/collectflow-frontend-sbom.json
            /tmp/collectflow-frontend-sbom.json.sha256
            /tmp/frontend-test-summary.json
            /tmp/frontend-vitest-report.json
            /tmp/frontend-npm-audit.json
            /tmp/frontend-secret-scan.json
            /tmp/frontend-lint-report.json
            /tmp/frontend-trivy-report.json
            /tmp/cross-repo-integration-report.json
          retention-days: 7
